<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="chart" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#FFFFFF"/>
    </linearGradient>
  </defs>
  <!-- 배경 라운드 사각형 -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- B 글자 -->
  <text x="130" y="340" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="300" fill="white" opacity="0.95">B</text>
  <!-- 차트 라인 (우상단) -->
  <polyline points="280,320 330,260 370,290 410,200 440,180" fill="none" stroke="url(#chart)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- 차트 점 -->
  <circle cx="440" cy="180" r="10" fill="#60A5FA"/>
  <!-- 상승 화살표 -->
  <polygon points="440,145 425,175 455,175" fill="#34D399" opacity="0.9"/>
</svg>
