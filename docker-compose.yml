# =============================================================================
# BitScope Docker Compose 설정
#
# OCI Always Free Tier VM(ARM)에 배포되는 전체 서비스 스택을 정의한다.
# 구성 요소: nginx (리버스 프록시) + Next.js (프론트엔드) + NestJS (백엔드) + MySQL (DB)
#
# 사용법:
#   개발:   docker compose up --build
#   프로덕션: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   중지:   docker compose down
#   로그:   docker compose logs -f [서비스명]
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # nginx - 리버스 프록시
  # 클라이언트 요청을 Next.js(3000)와 NestJS(4000)로 라우팅한다.
  # 도메인 확보 후 Let's Encrypt SSL 적용이 가능한 구조이다.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: bitscope-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt 인증서 볼륨 (도메인 확보 후 사용)
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bitscope-network
    healthcheck:
      # 127.0.0.1을 사용하여 Alpine에서 localhost가 IPv6(::1)로 해석되는 문제를 방지
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # ---------------------------------------------------------------------------
  # web - Next.js 프론트엔드 (port 3000)
  # SSR/RSC 렌더링, CORS 프록시(Route Handler)를 담당한다.
  # standalone 빌드로 최소한의 파일만 포함한다.
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost/api/backend}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-http://localhost}
        - NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID=${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-placeholder}
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-}
    container_name: bitscope-web
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # NestJS 백엔드 URL (내부 Docker 네트워크)
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost/api/backend}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-http://localhost}
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - bitscope-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # api - NestJS 백엔드 (port 4000)
  # 백그라운드 서비스: WebSocket 시세 수신, DB 저장, 알림 모니터링, cron 스케줄러
  # 공개 시세 데이터 처리에 집중하며 API Key를 보유하지 않는다.
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: bitscope-api
    environment:
      - NODE_ENV=production
      - PORT=4000
      # DB 테이블 자동 생성 (데모/초기 배포용, 상용 시 false로 변경하고 마이그레이션 사용)
      - DB_SYNCHRONIZE=true
      # MySQL 연결 설정
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USERNAME=${DB_USERNAME:-bitscope}
      - DB_PASSWORD=${DB_PASSWORD:-bitscope}
      - DB_DATABASE=${DB_DATABASE:-bitscope}
      - DB_CONNECTION_LIMIT=${DB_CONNECTION_LIMIT:-10}
      - DB_LOGGING=${DB_LOGGING:-false}
      # CORS 설정 (Docker 내부에서는 web:3000으로 통신)
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://web:3000}
      # 텔레그램 봇 설정 (미설정 시 텔레그램 기능 비활성화)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME:-}
      # Claude API 설정 (뉴스 요약 번역용, 미설정 시 요약 기능 비활성화)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    expose:
      - "4000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bitscope-network
    healthcheck:
      # 127.0.0.1을 사용하여 Alpine에서 localhost가 IPv6(::1)로 해석되는 문제를 방지
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # mysql - MySQL 데이터베이스
  # 포트폴리오 스냅샷, 알림, 리포트, 시세 이력 등을 저장한다.
  # OCI Free Tier 리소스 절약을 위한 최적화 설정을 포함한다.
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: bitscope-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-bitscope_root}
      - MYSQL_DATABASE=${DB_DATABASE:-bitscope}
      - MYSQL_USER=${DB_USERNAME:-bitscope}
      - MYSQL_PASSWORD=${DB_PASSWORD:-bitscope}
      # MySQL 문자셋 설정
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    volumes:
      # 데이터 영속성을 위한 볼륨
      - mysql-data:/var/lib/mysql
      # 초기화 스크립트 (최초 실행 시만 적용)
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    command:
      # OCI Free Tier 리소스 절약을 위한 MySQL 최적화 설정
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      - --innodb-log-file-size=48M
      - --default-time-zone=+09:00
    restart: unless-stopped
    networks:
      - bitscope-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # certbot - Let's Encrypt SSL 인증서 관리 (선택적)
  # 도메인 확보 후 활성화하여 SSL 인증서를 자동 발급/갱신한다.
  # 사용 시 profiles 주석을 해제하고 도메인을 설정한다.
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot
    container_name: bitscope-certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # 인증서 갱신 명령 (90일 주기로 수동 실행 또는 cron 설정)
    # docker compose run certbot renew
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    profiles:
      - ssl

# =============================================================================
# 볼륨 정의
# =============================================================================
volumes:
  # MySQL 데이터 영속 저장소
  mysql-data:
    driver: local
  # Let's Encrypt 인증서 저장소
  certbot-conf:
    driver: local
  # Let's Encrypt webroot 검증용
  certbot-www:
    driver: local

# =============================================================================
# 네트워크 정의
# =============================================================================
networks:
  bitscope-network:
    driver: bridge
