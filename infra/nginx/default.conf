# =============================================================================
# BitScope nginx 사이트 설정 (HTTP)
#
# 초기 IP + HTTP 환경용 리버스 프록시 설정.
# API Key가 서버로 전송되지 않으므로 HTTP 환경에서도 보안상 문제가 없다.
# 도메인 확보 후 ssl.conf로 전환 가능하다.
#
# 라우팅 규칙:
#   - /api/backend/* -> NestJS (port 4000) : 백엔드 API (스냅샷, 알림, 리포트 등)
#   - /socket.io/*   -> NestJS (port 4000) : Socket.IO WebSocket 연결
#   - 그 외 모든 요청 -> Next.js (port 3000) : 프론트엔드 + CORS 프록시
# =============================================================================

# 업스트림 서버 정의
upstream nextjs {
    server web:3000;
}

upstream nestjs {
    server api:4000;
}

server {
    listen 80;
    server_name _;

    # 보안 헤더
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # NestJS 백엔드 API 프록시
    # 스냅샷, 알림, 리포트, 김치 프리미엄 이력 등 백엔드 전용 API
    location /api/backend/ {
        # /api/backend/ 접두사를 제거하고 NestJS로 전달
        rewrite ^/api/backend/(.*) /$1 break;

        proxy_pass http://nestjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 타임아웃 설정 (리포트 생성 등 긴 요청 고려)
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Socket.IO WebSocket 연결 (NestJS 실시간 시세 브로드캐스트)
    location /socket.io/ {
        proxy_pass http://nestjs;
        proxy_http_version 1.1;

        # WebSocket 업그레이드 헤더
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 연결 유지를 위한 타임아웃 연장
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Next.js 프론트엔드 및 CORS 프록시 (기본 라우트)
    # 프론트엔드 페이지 + /api/exchange/* Route Handler 모두 포함
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;

        # WebSocket 업그레이드 지원 (Next.js HMR 등)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 타임아웃 설정
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 정적 파일 캐싱 (Next.js가 _next/static으로 제공)
    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # 정적 파일은 장기 캐싱 (Next.js가 해시 기반 파일명 사용)
        expires 365d;
        add_header Cache-Control "public, immutable";

        # 보안 헤더 (location 블록에서 add_header를 사용하면 상위 블록 헤더가 상속되지 않음)
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 헬스체크 엔드포인트
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }
}
