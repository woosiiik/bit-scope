# =============================================================================
# BitScope CI/CD 파이프라인
#
# main 브랜치에 코드가 병합되면 자동으로 빌드, 테스트, 배포를 수행한다.
# apps/web(프론트엔드)과 apps/api(백엔드)를 독립적으로 빌드/배포한다.
# OCI Always Free Tier VM(ARM)에 Docker Compose로 배포한다.
#
# 필수 GitHub Secrets:
#   OCI_SSH_PRIVATE_KEY  - OCI VM SSH 개인 키
#   OCI_HOST             - OCI VM 호스트 IP 또는 도메인
#   OCI_USER             - OCI VM SSH 사용자 (기본: opc)
#   DEPLOY_PATH          - OCI VM 배포 경로 (기본: /home/opc/bitscope)
#
# 선택적 GitHub Secrets:
#   MYSQL_ROOT_PASSWORD  - MySQL root 비밀번호
#   DB_PASSWORD          - MySQL 사용자 비밀번호
#
# 요구사항: NF2.4, NF6.4
# =============================================================================

name: BitScope CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 동시 배포 방지: 같은 브랜치에 대한 이전 배포가 진행 중이면 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 전역 환경 변수
env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.8.0'

jobs:
  # ===========================================================================
  # 1단계: 린트 및 타입 체크
  # 코드 품질을 검증한다. PR과 main 푸시 모두에서 실행된다.
  # ===========================================================================
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @bitscope/shared build

      - name: Run lint
        run: pnpm lint

      - name: Run type check
        run: pnpm type-check

  # ===========================================================================
  # 2단계: 테스트
  # 각 패키지의 단위/통합 테스트를 실행한다.
  # 공유 패키지, 프론트엔드, 백엔드를 병렬로 테스트한다.
  # ===========================================================================
  test-shared:
    name: Test - Shared Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @bitscope/shared build

      - name: Run shared tests
        run: pnpm --filter @bitscope/shared test

  test-web:
    name: Test - Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @bitscope/shared build

      - name: Run web tests
        run: pnpm --filter @bitscope/web test

  test-api:
    name: Test - API (NestJS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @bitscope/shared build

      - name: Run API tests
        run: pnpm --filter @bitscope/api test

  # ===========================================================================
  # 3단계: 빌드 검증
  # Docker 이미지 빌드가 정상적으로 완료되는지 검증한다.
  # apps/web과 apps/api를 독립적으로 빌드한다.
  # ===========================================================================
  build-web:
    name: Build - Web (Next.js)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-shared, test-web]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: bitscope-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  build-api:
    name: Build - API (NestJS)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-shared, test-api]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: bitscope-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # ===========================================================================
  # 4단계: OCI VM 배포
  # main 브랜치 푸시 시에만 실행된다 (PR에서는 빌드 검증까지만 수행).
  # SSH를 통해 OCI VM에 접속하여 최신 코드를 pull하고 Docker Compose로 배포한다.
  # ===========================================================================
  deploy:
    name: Deploy to OCI VM
    runs-on: ubuntu-latest
    needs: [build-web, build-api]
    # main 브랜치 푸시 시에만 배포 실행
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: http://${{ secrets.OCI_HOST }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to OCI VM via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER || 'opc' }}
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          port: 22
          # 배포 타임아웃: 10분 (Docker 이미지 빌드 포함)
          command_timeout: 10m
          script: |
            set -euo pipefail

            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/home/opc/bitscope' }}"

            echo "=== BitScope 배포 시작 ==="
            echo "배포 경로: ${DEPLOY_PATH}"
            echo "커밋: ${{ github.sha }}"
            echo "시간: $(date '+%Y-%m-%d %H:%M:%S %Z')"

            # 배포 디렉토리 존재 여부 확인
            if [ ! -d "${DEPLOY_PATH}" ]; then
              echo "최초 배포: 리포지토리 클론"
              git clone https://github.com/${{ github.repository }}.git "${DEPLOY_PATH}"
              cd "${DEPLOY_PATH}"
            else
              cd "${DEPLOY_PATH}"
              echo "기존 배포: 최신 코드 pull"
              git fetch origin main
              git reset --hard origin/main
            fi

            # .env 파일이 없으면 예제에서 복사 (최초 배포 시)
            if [ ! -f .env ]; then
              echo ".env 파일이 없습니다. .env.example에서 복사합니다."
              cp .env.example .env
              echo "주의: .env 파일을 환경에 맞게 수정해야 합니다."
            fi

            # Docker Compose로 서비스 빌드 및 재시작
            echo "=== Docker 이미지 빌드 및 서비스 재시작 ==="
            docker compose build --no-cache
            docker compose up -d

            # 헬스체크 대기 (최대 120초)
            # 모든 서비스가 healthy이거나 healthcheck가 없는 상태가 될 때까지 대기
            echo "=== 헬스체크 대기 ==="
            RETRY=0
            MAX_RETRY=24
            while [ $RETRY -lt $MAX_RETRY ]; do
              UNHEALTHY=$(docker compose ps --format json | grep -c '"Health":"unhealthy"' || true)
              STARTING=$(docker compose ps --format json | grep -c '"Health":"starting"' || true)
              if [ "$UNHEALTHY" -eq 0 ] && [ "$STARTING" -eq 0 ]; then
                echo "모든 서비스가 정상 상태입니다."
                break
              fi
              echo "서비스 상태 확인 중... (${RETRY}/${MAX_RETRY})"
              sleep 5
              RETRY=$((RETRY + 1))
            done

            # 배포 결과 확인
            echo "=== 서비스 상태 ==="
            docker compose ps

            # 오래된 Docker 이미지 정리
            echo "=== 미사용 Docker 이미지 정리 ==="
            docker image prune -f

            echo "=== BitScope 배포 완료 ==="
