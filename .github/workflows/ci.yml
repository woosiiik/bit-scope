# =============================================================================
# BitScope CI 파이프라인 - 변경 감지 기반 선택적 빌드/테스트
#
# PR에서 변경된 파일을 감지하여 영향 받는 패키지만 빌드/테스트한다.
# apps/web, apps/api, packages/shared를 독립적으로 빌드/테스트할 수 있다.
#
# 요구사항: NF2.4, NF2.5
# =============================================================================

name: BitScope CI

on:
  pull_request:
    branches:
      - main
    # 불필요한 실행 방지: 코드 변경이 있는 경우에만 실행
    paths-ignore:
      - '*.md'
      - '.claude/**'
      - '.vscode/**'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.8.0'

jobs:
  # ===========================================================================
  # 변경 파일 감지
  # PR에서 어떤 패키지가 변경되었는지 감지한다.
  # ===========================================================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.changes.outputs.shared }}
      web: ${{ steps.changes.outputs.web }}
      api: ${{ steps.changes.outputs.api }}
      infra: ${{ steps.changes.outputs.infra }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            shared:
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tsconfig.base.json'
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            api:
              - 'apps/api/**'
              - 'packages/shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
            infra:
              - 'docker-compose.yml'
              - 'infra/**'
              - 'apps/web/Dockerfile'
              - 'apps/api/Dockerfile'

  # ===========================================================================
  # 공유 패키지 테스트 (변경 시에만)
  # ===========================================================================
  test-shared:
    name: Test - Shared
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.shared == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & test shared
        run: |
          pnpm --filter @bitscope/shared build
          pnpm --filter @bitscope/shared test

  # ===========================================================================
  # 프론트엔드 테스트 및 빌드 (변경 시에만)
  # ===========================================================================
  test-and-build-web:
    name: Test & Build - Web
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @bitscope/shared build

      - name: Lint web
        run: pnpm --filter @bitscope/web lint

      - name: Type check web
        run: pnpm --filter @bitscope/web type-check

      - name: Test web
        run: pnpm --filter @bitscope/web test

      - name: Build web
        run: pnpm --filter @bitscope/web build

  # ===========================================================================
  # 백엔드 테스트 및 빌드 (변경 시에만)
  # ===========================================================================
  test-and-build-api:
    name: Test & Build - API
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @bitscope/shared build

      - name: Lint API
        run: pnpm --filter @bitscope/api lint

      - name: Type check API
        run: pnpm --filter @bitscope/api type-check

      - name: Test API
        run: pnpm --filter @bitscope/api test

      - name: Build API
        run: pnpm --filter @bitscope/api build

  # ===========================================================================
  # Docker 빌드 검증 (인프라 변경 시에만)
  # ===========================================================================
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: bitscope-web:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build API Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: bitscope-api:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
